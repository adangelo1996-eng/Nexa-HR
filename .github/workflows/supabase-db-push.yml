# Applica le migration SQL sul database Supabase collegato al progetto in infra/supabase/config.toml
#
# Secrets (scegli una delle due modalità):
#   A) SUPABASE_DB_URL — URI Postgres (consigliato in CI: secret "Transaction" o Direct dal dashboard)
#   B) SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD — come per `supabase link` locale
#
# Avvio: ogni push su main (migrazioni idempotenti; nessuna nuova migration = nessuna modifica DB),
# oppure "Run workflow" manuale.

name: Supabase DB push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: supabase-db-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db push --db-url "$SUPABASE_DB_URL" --yes --workdir infra/supabase
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Imposta SUPABASE_DB_URL oppure SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD."
            exit 1
          fi
          supabase link --project-ref kcaliyzmsvsrkuonnmrc --password "$SUPABASE_DB_PASSWORD" --yes --workdir infra/supabase
          supabase db push --yes --workdir infra/supabase
