# Applica le migration SQL sul database Supabase (project_id in infra/supabase/config.toml).
#
# Secrets GitHub → Settings → Secrets and variables → Actions (scegli UNA modalità):
#   A) SUPABASE_DB_URL — URI Postgres Session o Direct (dashboard Supabase → Connect)
#      oppure stesso valore come DATABASE_URL (alias accettato dallo script)
#      oppure SUPABASE_POOLER_URL — Session pooler IPv4 (se la direct è solo IPv6)
#   B) SUPABASE_ACCESS_TOKEN (PAT account Supabase) + SUPABASE_DB_PASSWORD (password DB postgres)
#
# Lo step usa `node scripts/supabase-remote-push.mjs` (stessa logica di Render) così pooler/token
# e project ref da config.toml restano allineati.
#
# Push su main: solo se cambiano migrazioni/config workflow (evita run inutili).
# workflow_dispatch: sempre (es. dopo aver aggiunto i secret).

name: Supabase DB push

on:
  push:
    branches: [main]
    paths:
      - "infra/supabase/migrations/**"
      - "infra/supabase/config.toml"
      - ".github/workflows/supabase-db-push.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-db-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: node scripts/supabase-remote-push.mjs
