# Render Blueprint — repository GitLab: Nexa-HR (root del monorepo).
# https://render.com/docs/blueprint-spec | GitLab: https://render.com/docs/gitlab
#
# Setup iniziale su Render (da fare una volta):
# 1) Account Render → Integrations → collega GitLab (autorizza il gruppo/utente dove sta Nexa-HR).
# 2) New + → Blueprint → scegli il repo GitLab "Nexa-HR" e branch `main`.
# 3) Render rileva questo file alla root; conferma creazione dei due Web Service.
# 4) Compila le variabili `sync: false` (Supabase, URL incrociati dopo il primo deploy).
# 5) Runtime deve essere Node (mai Docker): non c'è Dockerfile nel repo.
#
# Dopo il primo deploy: CORS_ORIGIN sul backend = URL https del frontend Render;
# NEXT_PUBLIC_API_BASE_URL sul frontend = URL https del backend (/api opzionale, vedi README).
#
# Payroll Svizzera (opzionale, default disattivato se omesso):
#   Backend:  NEXA_SWISS_PAYROLL_ENABLED=true
#   Frontend: NEXT_PUBLIC_NEXA_SWISS_PAYROLL_ENABLED=true
# Catalogo: docs/catalog/payroll-svizzera.md
#
# Servizi creati fuori da questo blueprint: impostare a mano Health Check Path frontend = /health (vedi README).

services:
  - type: web
    name: nexa-hr-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@10.6.0 --activate && pnpm install --frozen-lockfile && node scripts/supabase-remote-push.mjs --optional && pnpm run build:backend:render
    # Avvio senza Corepack/pnpm: in start, corepack prepare può andare in timeout verso registry.npmjs.org
    # (UND_ERR_CONNECT_TIMEOUT) anche se la build è ok. Lo script @payday/backend è solo "node dist/main.js".
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_SHARED_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Opzionale ma consigliata: URI Postgres session mode (5432) per migrazioni in build e, a runtime, pool transazioni import Excel (stesso valore se non imposti DATABASE_URL).
      - key: SUPABASE_DB_URL
        sync: false
      # Opzionale: sovrascrive solo il pool import se diversa dalla stringa migrazioni (raro).
      - key: DATABASE_URL
        sync: false
      - key: APP_SSO_SHARED_KEY
        sync: false
      - key: NEXA_SWISS_PAYROLL_ENABLED
        sync: false

  - type: web
    name: nexa-hr-frontend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # @payday/frontend prebuild compila @payday/domain (main → dist/). Anche senza step esplicito qui, Next non va in errore module-not-found.
    buildCommand: corepack enable && corepack prepare pnpm@10.6.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @payday/frontend build
    # Stesso motivo del backend: niente fetch npm nello start. Percorso next dipende da node_modules locale post-pnpm install.
    startCommand: cd apps/frontend && node ./node_modules/next/dist/bin/next start -H 0.0.0.0
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: CENTRAL_HUB_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_CENTRAL_HUB_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_NEXA_SWISS_PAYROLL_ENABLED
        sync: false
